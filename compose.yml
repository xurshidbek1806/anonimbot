services:
  bot:
    build: .
    image: anonimbot:latest
    container_name: anonimbot
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - .env
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
      ADMIN_IDS: ${ADMIN_IDS:?ADMIN_IDS is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    networks:
      - infra

networks:
  infra:
    external: true
    name: xurshid
