# Har qanday serverda 0 dan ishga tushirish: bot + o'zining PostgreSQL bazasi.
# Ishlatish: docker compose -f compose.standalone.yml up -d --build
name: anonimbot

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: anonimbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env faylida kerak}
      POSTGRES_DB: anonimbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anonimbot -d anonimbot"]
      interval: 5s
      timeout: 3s
      retries: 20

  bot:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN .env faylida kerak}
      ADMIN_IDS: ${ADMIN_IDS:-}
      DATABASE_URL: postgresql://anonimbot:${POSTGRES_PASSWORD}@db:5432/anonimbot

volumes:
  pgdata:
